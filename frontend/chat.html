<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat | Real-Time Chat</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #263b80 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #4b237d 0%,
                    transparent 35%
                ),
                #080d1f;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* =========================
           CHAT CONTAINER
        ========================= */

        .chat-container {
            width: 100%;
            max-width: 1050px;

            height: 700px;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: #0d1326;

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 24px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.5);
        }

        /* =========================
           HEADER
        ========================= */

        .chat-header {
            min-height: 78px;

            padding: 15px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .chat-icon {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: rgba(255,255,255,0.15);

            border: 1px solid rgba(255,255,255,0.2);

            font-size: 23px;
        }

        .header-title h2 {
            font-size: 19px;
            font-weight: 700;
        }

        .header-title p {
            margin-top: 3px;

            font-size: 12px;

            color: rgba(255,255,255,0.75);
        }

        /* =========================
           HEADER RIGHT
        ========================= */

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status {
            display: flex;
            align-items: center;

            gap: 7px;

            font-size: 12px;

            color: rgba(255,255,255,0.85);
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #ef4444;
        }

        .status-dot.connected {
            background: #22c55e;

            box-shadow:
                0 0 10px rgba(34,197,94,0.8);
        }

        .logout-btn {
            border: 1px solid rgba(255,255,255,0.2);

            background: rgba(255,255,255,0.1);

            color: white;

            padding: 8px 14px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 600;

            transition: 0.25s;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* =========================
           USER BAR
        ========================= */

        .user-info {
            min-height: 55px;

            padding: 10px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #11182d;

            border-bottom: 1px solid #252d45;
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 13px;

            font-weight: bold;
        }

        .user-id {
            color: #8f97aa;

            font-size: 12px;
        }

        .user-id strong {
            color: #c7d2fe;
        }

        .connect-btn {
            border: none;

            padding: 8px 16px;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            cursor: pointer;

            font-size: 12px;

            font-weight: 600;

            transition: 0.25s;
        }

        .connect-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 5px 15px rgba(99,102,241,0.3);
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            flex: 1;

            padding: 25px;

            overflow-y: auto;

            background:
                radial-gradient(
                    circle at center,
                    #151d35,
                    #0c1224
                );

            display: flex;

            flex-direction: column;

            gap: 13px;

            scrollbar-width: thin;
        }

        .welcome-message {
            width: fit-content;

            max-width: 420px;

            margin: auto;

            padding: 22px 28px;

            text-align: center;

            color: #8f97aa;

            font-size: 13px;

            line-height: 1.7;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.07);

            border-radius: 15px;
        }

        /* =========================
           MESSAGE BUBBLE
        ========================= */

        .message {
            position: relative;

            max-width: 68%;

            padding: 12px 15px;

            border-radius: 15px;

            font-size: 14px;

            line-height: 1.5;

            word-wrap: break-word;

            animation: messageIn 0.25s ease;
        }

        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .sent {
            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #7c3aed
                );

            color: white;

            border-bottom-right-radius: 4px;

            box-shadow:
                0 5px 15px rgba(79,70,229,0.2);
        }

        .received {
            align-self: flex-start;

            background: #1a2238;

            color: #e5e7eb;

            border: 1px solid #29334d;

            border-bottom-left-radius: 4px;
        }

        .message small {
            display: block;

            margin-top: 5px;

            font-size: 9px;

            opacity: 0.6;

            text-align: right;
        }

        /* =========================
           INPUT AREA
        ========================= */

        .input-area {
            padding: 15px 20px 18px;

            background: #11182d;

            border-top: 1px solid #252d45;
        }

        /* Receiver */

        .receiver-row {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 10px;
        }

        .receiver-label {
            color: #8f97aa;

            font-size: 12px;

            white-space: nowrap;
        }

        .receiver-row input {
            width: 170px;

            padding: 9px 11px;

            border: 1px solid #303951;

            border-radius: 8px;

            outline: none;

            background: #0c1224;

            color: white;

            font-size: 12px;

            transition: 0.25s;
        }

        .receiver-row input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.12);
        }

        .receiver-row input::placeholder {
            color: #687086;
        }

        /* Message input */

        .message-row {
            display: flex;

            gap: 10px;
        }

        .message-row input {
            flex: 1;

            height: 50px;

            padding: 0 17px;

            border: 1px solid #303951;

            border-radius: 25px;

            outline: none;

            background: #0c1224;

            color: white;

            font-size: 14px;

            transition: 0.25s;
        }

        .message-row input::placeholder {
            color: #687086;
        }

        .message-row input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.12);
        }

        /* =========================
           SEND BUTTON
        ========================= */

        .send-btn {
            width: 50px;
            height: 50px;

            flex-shrink: 0;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.25s;
        }

        .send-btn:hover {
            transform: scale(1.08);

            box-shadow:
                0 7px 20px rgba(99,102,241,0.35);
        }

        .send-btn:active {
            transform: scale(0.96);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;

                border-radius: 0;
            }

            .chat-header {
                padding: 13px 15px;
            }

            .header-title h2 {
                font-size: 16px;
            }

            .header-right {
                gap: 8px;
            }

            .status {
                display: none;
            }

            .user-info {
                padding: 10px 15px;
            }

            .messages {
                padding: 18px 12px;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 12px;
            }

            .receiver-row input {
                width: 150px;
            }

        }

        @media (max-width: 400px) {

            .chat-icon {
                width: 42px;
                height: 42px;
            }

            .logout-btn {
                padding: 7px 10px;
            }

            .receiver-label {
                display: none;
            }

        }

    </style>

</head>


<body>


<div class="chat-container">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="chat-header">

        <div class="header-left">

            <div class="chat-icon">
                💬
            </div>

            <div class="header-title">

                <h2>
                    Real-Time Chat
                </h2>

                <p id="username">
                    Welcome
                </p>

            </div>

        </div>


        <div class="header-right">

            <div class="status">

                <span
                    class="status-dot"
                    id="statusDot">
                </span>

                <span id="statusText">
                    Disconnected
                </span>

            </div>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>


    <!-- =========================
         USER INFORMATION
    ========================= -->

    <div class="user-info">

        <div class="user-details">

            <div class="avatar" id="avatar">
                U
            </div>

            <div class="user-id">

                User ID:

                <strong id="userId">
                    -
                </strong>

            </div>

        </div>


        <button
            class="connect-btn"
            onclick="connectWebSocket()">

            Connect

        </button>

    </div>


    <!-- =========================
         MESSAGES
    ========================= -->

    <div
        class="messages"
        id="messages">

        <div class="welcome-message">

            <strong>👋 Welcome to Real-Time Chat</strong>

            <br>

            Connect to the server and start
            messaging in real time.

        </div>

    </div>


    <!-- =========================
         INPUT AREA
    ========================= -->

    <div class="input-area">


        <div class="receiver-row">

            <span class="receiver-label">
                Chat with User ID:
            </span>

            <input
                type="number"
                id="receiverId"
                placeholder="Enter user ID"
            >

        </div>


        <div class="message-row">

            <input
                type="text"
                id="messageInput"
                placeholder="Write a message..."
                autocomplete="off"
                onkeydown="handleEnter(event)"
            >


            <button
                class="send-btn"
                onclick="sendMessage()">

                ➤

            </button>

        </div>

    </div>


</div>


<script>


/* =========================
   USER DATA
========================= */

const userId =
    localStorage.getItem("user_id");


const username =
    localStorage.getItem("username");


document.getElementById("userId").innerText =
    userId || "Not logged in";


document.getElementById("username").innerText =
    username
        ? "Welcome, " + username
        : "Welcome";


/* Avatar */

if (username) {

    document.getElementById("avatar").innerText =
        username.charAt(0).toUpperCase();

}


/* =========================
   WEBSOCKET
========================= */

let socket = null;


function connectWebSocket() {


    if (!userId) {

        alert("Please login first.");

        window.location.href =
            "/login-page";

        return;

    }


    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        return;

    }


    const protocol =
        window.location.protocol === "https:"
            ? "wss:"
            : "ws:";


    const wsUrl =
        protocol +
        "//" +
        window.location.host +
        "/ws/" +
        userId;


    socket =
        new WebSocket(wsUrl);


    socket.onopen =
        function() {


            document.getElementById(
                "statusText"
            ).innerText =
                "Connected";


            document.getElementById(
                "statusDot"
            ).classList.add(
                "connected"
            );


        };


    socket.onmessage =
        function(event) {


            const data =
                JSON.parse(
                    event.data
                );


            if (data.error) {

                alert(data.error);

                return;

            }


            displayMessage(
                data.message,
                data.sender_id == userId
            );


        };


    socket.onclose =
        function() {


            document.getElementById(
                "statusText"
            ).innerText =
                "Disconnected";


            document.getElementById(
                "statusDot"
            ).classList.remove(
                "connected"
            );


        };


    socket.onerror =
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );

        };

}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {


    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        alert(
            "Please connect first."
        );

        return;

    }


    const receiverId =
        document.getElementById(
            "receiverId"
        ).value;


    const message =
        document.getElementById(
            "messageInput"
        ).value.trim();


    if (!receiverId) {

        alert(
            "Please enter Receiver ID."
        );

        return;

    }


    if (!message) {

        return;

    }


    socket.send(
        JSON.stringify({

            receiver_id:
                parseInt(receiverId),

            message:
                message

        })
    );


    document.getElementById(
        "messageInput"
    ).value = "";


    document.getElementById(
        "messageInput"
    ).focus();

}


/* =========================
   DISPLAY MESSAGE
========================= */

function displayMessage(
    message,
    isSent
) {


    const messages =
        document.getElementById(
            "messages"
        );


    const welcome =
        document.querySelector(
            ".welcome-message"
        );


    if (welcome) {

        welcome.remove();

    }


    const messageDiv =
        document.createElement(
            "div"
        );


    messageDiv.classList.add(
        "message"
    );


    if (isSent) {

        messageDiv.classList.add(
            "sent"
        );

    } else {

        messageDiv.classList.add(
            "received"
        );

    }


    messageDiv.innerHTML =
        escapeHtml(message) +
        "<small>" +
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ) +
        "</small>";


    messages.appendChild(
        messageDiv
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================
   ENTER TO SEND
========================= */

function handleEnter(event) {


    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   HTML SECURITY
========================= */

function escapeHtml(text) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================
   LOGOUT
========================= */

function logout() {


    if (socket) {

        socket.close();

    }


    localStorage.removeItem(
        "user_id"
    );


    localStorage.removeItem(
        "username"
    );


    localStorage.removeItem(
        "email"
    );


    window.location.href =
        "/login-page";

}


/* =========================
   AUTO CONNECT
========================= */

if (userId) {

    connectWebSocket();

}

</script>


</body>

</html>
